name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.version.outputs.semVer }}
      assemblySemVer: ${{ steps.version.outputs.assemblySemVer }}
      assemblySemFileVer: ${{ steps.version.outputs.assemblySemFileVer }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.2.0
        with:
          versionSpec: '6.4.x'

      - name: Determine Version
        id: version
        uses: gittools/actions/gitversion/execute@v4.2.0

      - name: Display Version
        run: echo "SemVer:${{ steps.version.outputs.semVer }}"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            artifact: SimpleRogue.exe
            extension: exe
          - rid: win-arm64
            artifact: SimpleRogue.exe
            extension: exe
          - rid: linux-x64
            artifact: SimpleRogue
            extension: zip
          - rid: osx-x64
            artifact: SimpleRogue
            extension: zip
          - rid: osx-arm64
            artifact: SimpleRogue
            extension: zip
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SimpleRogue/SimpleRogue.csproj

      - name: Build and Publish
        run: |
          dotnet publish SimpleRogue/SimpleRogue.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:Version=${{ needs.version.outputs.semVer }} \
            -p:AssemblyVersion=${{ needs.version.outputs.assemblySemVer }} \
            -p:FileVersion=${{ needs.version.outputs.assemblySemFileVer }} \
            -o publish

      - name: Package artifact
        run: |
          VERSION=${{ needs.version.outputs.semVer }}
          if [ "${{ matrix.extension }}" == "zip" ]; then
            cd publish
            zip -r ../SimpleRogue_${{ matrix.rid }}_v${VERSION}.zip .
            cd ..
          else
            mv publish/${{ matrix.artifact }} SimpleRogue_${{ matrix.rid }}_v${VERSION}.${{ matrix.extension }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleRogue_${{ matrix.rid }}
          path: SimpleRogue_${{ matrix.rid }}_v${{ needs.version.outputs.semVer }}.*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.version.outputs.semVer }}
          name: Release v${{ needs.version.outputs.semVer }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
